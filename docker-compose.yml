version: '3.8'

services:
  # 1. Relational Database: PostgreSQL 16 for Academic & Student Records
  postgres:
    image: postgres:16-alpine
    container_name: cse_erp_postgres
    restart: always
    environment:
      POSTGRES_DB: cse_erp
      POSTGRES_USER: cse_user
      POSTGRES_PASSWORD: cse_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cse_erp_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cse_user -d cse_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Document Database: MongoDB 7.0 for AI Memory & Conversations
  mongodb:
    image: mongo:7.0
    container_name: cse_erp_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cse_erp_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: cse_erp_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cse_erp_net

  # 3b. Redis for AI Session Memory & Pending Write Proposals
  redis:
    image: redis:7-alpine
    container_name: cse_erp_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - cse_erp_net

  # 4. AI Microservice: Python FastAPI + Groq LLM + Qdrant (768 Dimensions)
  python-ai:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cse_erp_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME:-cse-department-erp-768}
      - PINECONE_CLOUD=${PINECONE_CLOUD:-aws}
      - PINECONE_REGION=${PINECONE_REGION:-us-east-1}
      - EMBEDDING_DIMENSION=768
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=Notes
      - MONGODB_URI=mongodb://mongodb:27017/cse_erp
      - DATABASE_URL=postgresql://cse_user:cse_password123@postgres:5432/cse_erp
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=cse_erp
      - PGUSER=cse_user
      - PGPASSWORD=cse_password123
      - EMBEDDING_MODEL=sentence-transformers/all-mpnet-base-v2
      - MAX_CONTEXT_TOKENS=4096
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - cse_erp_net

  # 5. Core API Gateway: Node.js Express + JWT + Multer + PostgreSQL
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cse_erp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=cse_super_secure_jwt_secret_token_key_2025
      - JWT_REFRESH_SECRET=cse_super_secure_refresh_secret_key_2025
      - DATABASE_URL=postgresql://cse_user:cse_password123@postgres:5432/cse_erp
      - USE_POSTGRES=true
      - MONGODB_URI=mongodb://mongodb:27017/cse_erp
      - PYTHON_AI_SERVICE_URL=http://python-ai:8000
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      - UPLOAD_PATH=/app/uploads
      - CORS_ORIGIN=*
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      python-ai:
        condition: service_started
    networks:
      - cse_erp_net

  # 6. Web Application UI: React Vite + Glassmorphism Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cse_erp_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cse_erp_net

networks:
  cse_erp_net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
  backend_uploads:
  backend_logs:
